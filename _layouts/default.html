<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf9f6">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
    {% if page.math %}
    <script>window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]}};</script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header shell">
      <a class="site-identity" href="{{ '/' | relative_url }}">
        <span class="site-name">{{ site.title }}</span>
        <span class="site-subtitle">{{ site.tagline }}</span>
      </a>
      <nav class="primary-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url == '/index.html' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/about.html' | relative_url }}"{% if page.url == '/about.html' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/people.html' | relative_url }}"{% if page.url == '/people.html' %} aria-current="page"{% endif %}>People</a>
        <a href="{{ '/contact.html' | relative_url }}"{% if page.url == '/contact.html' %} aria-current="page"{% endif %}>Contact</a>
      </nav>
    </header>
    <main id="main-content" class="shell page-content {{ page.page_class }}" tabindex="-1">{{ content }}</main>
    <footer class="site-footer shell">
      <p>Leonardo Oña <span class="footer-separator" aria-hidden="true">/</span> Theoretical evolutionary biology</p>
      <nav class="profile-links" aria-label="Academic profiles">
        <a href="{{ site.scholar_url }}">Google Scholar</a>
        <a href="{{ site.github_url }}">GitHub</a>
        <a href="{{ site.researchgate_url }}">ResearchGate</a>
      </nav>
    </footer>
  </body>
</html>
